    <!-- Balance Overview -->

      <div class="balance-card">

        <div class="balance-amount">₹<span id="monthlyDeposit">12,500</span></div>
        <div class="balance-change positive">
          <i class="fas fa-trending-up"></i> +150% from last month

      </div>
      
      <div class="balance-card">
        <h3>Total Deposits</h3>
        <div class="balance-amount">₹<span id="totalDeposit">87,500</span></div>

    <!-- Deposit Section -->

        </div>
        
        <form id="depositForm" autocomplete="off" novalidate>
          <div class="form-group">
            <label for="depositAmount">Amount (₹)</label>
            <input type="number" id="depositAmount" class="form-control" placeholder="Enter amount" min="100" required>
          </div>

          <div class="form-group">
            <label>Payment Method</label>
            <div class="payment-methods">

              <div class="payment-method" data-method="netbanking">

                <div class="payment-name">Net Banking</div>
              </div>
              <div class="payment-method" data-method="creditcard">
                <i class="fas fa-credit-card payment-icon"></i>
                <div class="payment-name">Credit Card</div>
              </div>
              <div class="payment-method" data-method="debitcard">

      <!-- Quick Actions -->
      <div class="quick-actions">

          <div class="action-btn" onclick="quickDeposit(1000)">
            <i class="fas fa-bolt action-icon"></i>
            <div class="action-text">₹1,000</div>
          </div>
          <div class="action-btn" onclick="quickDeposit(5000)">
            <i class="fas fa-bolt action-icon"></i>
            <div class="action-text">₹5,000</div>
          </div>
          <div class="action-btn" onclick="quickDeposit(10000)">
            <i class="fas fa-bolt action-icon"></i>
            <div class="action-text">₹10,000</div>
          </div>
          <div class="action-btn" onclick="quickDeposit(25000)">

        <i class="fas fa-robot ai-icon"></i>

        Analyzing your deposit patterns and providing personalized recommendations...

    <!-- Transaction History -->
    <div class="transaction-section">
      <div class="section-header">
        <h2>Transaction History</h2>
        <div class="transaction-controls">

            <i class="fas fa-download"></i> Export CSV

  <script src="/static/js/layout.js"></script>
  <script>
// Application State
let balance = 5000;
let monthlyDeposit = 12500;
let totalDeposit = 87500;
let transactions = [];
let selectedPaymentMethod = 'upi';

// Mobile menu functionality
document.addEventListener('DOMContentLoaded', function() {
  const menuToggle = document.querySelector('.menu-toggle');
  const navItems = document.querySelector('.nav-items');
  
  if (menuToggle && navItems) {
    menuToggle.addEventListener('click', function() {
      navItems.classList.toggle('show');
      // Animate hamburger to X
      const spans = menuToggle.querySelectorAll('span');
      spans.forEach(span => span.classList.toggle('active'));
    });
    
    // Close menu when clicking outside
    document.addEventListener('click', function(event) {
      if (!event.target.closest('.navbar') && navItems.classList.contains('show')) {
        navItems.classList.remove('show');
        const spans = menuToggle.querySelectorAll('span');
        spans.forEach(span => span.classList.remove('active'));
      }
    });
  }

  // Initialize payment method selection
  document.querySelectorAll('.payment-method').forEach(method => {
    method.addEventListener('click', () => {
      document.querySelectorAll('.payment-method').forEach(m => m.classList.remove('active'));
      method.classList.add('active');
      selectedPaymentMethod = method.dataset.method;
    });
  });

  // Load saved data
  const savedTransactions = localStorage.getItem('depositTransactions');
  const savedBalance = localStorage.getItem('userBalance');
  const savedMonthly = localStorage.getItem('monthlyDeposit');
  const savedTotal = localStorage.getItem('totalDeposit');
  
  if (savedTransactions) {
    transactions = JSON.parse(savedTransactions);
  }
  
  if (savedBalance) balance = parseInt(savedBalance);
  if (savedMonthly) monthlyDeposit = parseInt(savedMonthly);
  if (savedTotal) totalDeposit = parseInt(savedTotal);
  
  // Initial render
  updateBalanceDisplay();
  renderTransactionHistory();
  updateAIInsight();
  
  // Update AI insights periodically
  setInterval(updateAIInsight, 10000);
});

// Update balance display
function updateBalanceDisplay() {
  document.getElementById('balanceAmount').textContent = balance.toLocaleString();
  document.getElementById('monthlyDeposit').textContent = monthlyDeposit.toLocaleString();
  document.getElementById('totalDeposit').textContent = totalDeposit.toLocaleString();
}

// Render transaction history
function renderTransactionHistory() {
  const transactionList = document.getElementById('transactionList');
  
  if (transactions.length === 0) {
    transactionList.innerHTML = `
      <div class="empty-state">
        <i class="fas fa-receipt"></i>
        <h3>No Transactions Yet</h3>
        <p>Your deposit history will appear here</p>
      </div>
    `;
    return;
  }
  
  transactionList.innerHTML = transactions.map(transaction => `
    <div class="transaction-item">
      <div class="transaction-icon ${transaction.type}">
        <i class="fas fa-${transaction.type === 'deposit' ? 'arrow-down' : 'arrow-up'}"></i>
      </div>
      <div class="transaction-info">
        <div class="transaction-method">${transaction.method.toUpperCase()} • ${transaction.details}</div>
        <div class="transaction-date">${transaction.date}</div>
      </div>
      <div class="transaction-amount ${transaction.type}">
        ${transaction.type === 'deposit' ? '+' : '-'}₹${transaction.amount.toLocaleString()}
      </div>
      <div class="transaction-status ${transaction.status}">
        ${transaction.status}
      </div>
    </div>
  `).join('');
}

// Add transaction
function addTransaction(amount, method, details) {
  const newTransaction = {
    id: Date.now(),
    type: 'deposit',
    amount: amount,
    method: method,
    details: details,
    date: new Date().toLocaleString(),
    status: 'completed'
  };
  
  transactions.unshift(newTransaction);
  
  // Update balances
  balance += amount;
  monthlyDeposit += amount;
  totalDeposit += amount;
  
  updateBalanceDisplay();
  renderTransactionHistory();
  
  // Save to localStorage
  localStorage.setItem('depositTransactions', JSON.stringify(transactions));
  localStorage.setItem('userBalance', balance.toString());
  localStorage.setItem('monthlyDeposit', monthlyDeposit.toString());
  localStorage.setItem('totalDeposit', totalDeposit.toString());
}

// Handle deposit form submission
document.getElementById('depositForm').addEventListener('submit', function(e) {
  e.preventDefault();
  
  const amount = parseInt(document.getElementById('depositAmount').value);
  const details = document.getElementById('paymentDetails').value.trim();
  
  if (!amount || amount < 100) {
    showMessage('error', 'Minimum deposit amount is ₹100');
    return;
  }
  
  if (!details) {
    showMessage('error', 'Please enter payment details');
    return;
  }
  
  // Simulate processing
  showMessage('success', 'Processing your deposit...');
  
  setTimeout(() => {
    addTransaction(amount, selectedPaymentMethod, details);
    showMessage('success', `Successfully deposited ₹${amount.toLocaleString()}`);
    
    // Reset form
    document.getElementById('depositForm').reset();
    document.querySelector('.payment-method[data-method="upi"]').click(); // Reset to UPI
  }, 2000);
});

// Quick deposit function
function quickDeposit(amount) {
  document.getElementById('depositAmount').value = amount;
  showMessage('success', `Quick deposit of ₹${amount.toLocaleString()} ready! Click "Secure Deposit" to proceed.`);
}

// Show message
function showMessage(type, text) {
  const successMsg = document.getElementById('successMessage');
  const errorMsg = document.getElementById('errorMessage');
  
  successMsg.style.display = 'none';
  errorMsg.style.display = 'none';
  
  if (type === 'success') {
    successMsg.innerHTML = `<i class="fas fa-check-circle"></i> ${text}`;
    successMsg.style.display = 'block';
  } else {
    errorMsg.innerHTML = `<i class="fas fa-exclamation-circle"></i> ${text}`;
    errorMsg.style.display = 'block';
  }
  
  // Auto-hide messages
  setTimeout(() => {
    successMsg.style.display = 'none';
    errorMsg.style.display = 'none';
  }, 5000);
}

// Export history
function exportHistory() {
  const csv = "Type,Amount,Method,Details,Date,Status\n" + 
    transactions.map(t => 
      `${t.type},${t.amount},${t.method},${t.details},${t.date},${t.status}`
    ).join("\n");
  
  const blob = new Blob([csv], { type: 'text/csv' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'deposit_history.csv';
  a.click();
  URL.revokeObjectURL(url);
  
  showMessage('success', 'Transaction history exported successfully');
}

// Refresh history
function refreshHistory() {
  renderTransactionHistory();
  showMessage('success', 'Transaction history refreshed');
}

// Toggle theme
function toggleTheme() {
  document.body.classList.toggle('light');
}

// Update AI insight
function updateAIInsight() {
  const insights = [
    "Based on your deposit pattern, consider setting up auto-investments for better portfolio growth.",
    "Your consistent deposits show strong financial discipline. Keep it up!",
    "AI recommends diversifying your investment across different sectors for optimal returns.",
    "Consider increasing your deposit frequency to take advantage of dollar-cost averaging."
  ];
  
  const randomInsight = insights[Math.floor(Math.random() * insights.length)];
  document.getElementById('aiInsightText').textContent = randomInsight;
}
</script>
