<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AlphaAnalytics v3.0 - AI Market Intelligence</title>
  
  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet" />
  
  <!-- Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  
  <!-- Core CSS -->
  <link rel="stylesheet" href="/static/css/variables.css" />
  <link rel="stylesheet" href="/static/css/main.css" />
  <link rel="stylesheet" href="/static/css/components.css" />
  <link rel="stylesheet" href="/static/css/animations.css" />
</head>
<body>
  <!-- Animated Background -->
  <canvas id="bg-canvas"></canvas>

  <div id="app-container">
    <!-- Sidebar Component (Injected via JS) -->
    <div id="sidebar-mount"></div>
    
    <!-- Main Content Area -->
    <main class="main-content">
      <!-- Navbar Component (Injected via JS) -->
      <div id="navbar-mount"></div>
      
      <!-- Page Content (Injected via JS based on route) -->
      <div id="page-content" class="animate-fade-in">
        <div class="flex-center" style="height: 50vh;">
          <div class="animate-spin text-cyan" style="font-size: 2rem;">
            <i class="fas fa-circle-notch"></i>
          </div>
        </div>
      </div>
    </main>
  </div>

  <!-- Toast Notifications Mount -->
  <div id="toast-mount"></div>

  <!-- External Libraries -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/apexcharts"></script>
  
  <!-- Core Application -->
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
