// Configuration
const CONFIG = {
    API_KEY: "5f988a8aff6b4b58848dfcf67af727d9",
    API_BASE_URL: "https://api.twelvedata.com",
    DEBOUNCE_DELAY: 500,
    DEFAULT_SYMBOL: "AAPL",
    MAX_ORDERS_DISPLAY: 50
};

// Application State
const AppState = {
    currentTradeType: 'buy',
    orders: JSON.parse(localStorage.getItem('tradingOrders')) || [],
    currentSymbol: CONFIG.DEFAULT_SYMBOL,
    priceUpdateInterval: null
};

// Mobile Menu Controller
class MobileMenu {
    constructor() {
        this.menuToggle = document.querySelector('.menu-toggle');
        this.navItems = document.querySelector('.nav-items');
        this.isOpen = false;
        this.init();
    }

    init() {
        if (this.menuToggle && this.navItems) {
            this.menuToggle.addEventListener('click', (e) => {
                e.stopPropagation();
                this.toggle();
            });

            this.setupClickOutsideHandler();
        }
    }

    toggle() {
        this.isOpen = !this.isOpen;
        this.navItems.classList.toggle('show');
        
        const spans = this.menuToggle.querySelectorAll('span');
        spans.forEach(span => span.classList.toggle('active'));
    }

    close() {
        this.isOpen = false;
        this.navItems.classList.remove('show');
        const spans = this.menuToggle.querySelectorAll('span');
        spans.forEach(span => span.classList.remove('active'));
    }

    setupClickOutsideHandler() {
        document.addEventListener('click', (event) => {
            if (this.isOpen && !event.target.closest('.navbar')) {
                this.close();
            }
        });
    }
}

// Notification Manager
class NotificationManager {
    static show(message, type = 'info') {
        // Create notification element if it doesn't exist
        let notification = document.getElementById('tradingNotification');
        if (!notification) {
            notification = document.createElement('div');
            notification.id = 'tradingNotification';
            notification.className = 'notification';
            document.body.appendChild(notification);
        }

        const iconClass = {
            success: 'fa-check-circle',
            error: 'fa-exclamation-circle',
            warning: 'fa-exclamation-triangle',
            info: 'fa-info-circle'
        }[type] || 'fa-info-circle';

        notification.innerHTML = `
            <div class="notification-content">
                <i class="fas ${iconClass} notification-icon"></i>
                <span class="notification-message">${message}</span>
                <button class="notification-close" onclick="this.parentElement.parentElement.remove()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
        `;

        notification.className = `notification ${type} show`;
        
        // Auto remove after 5 seconds
        setTimeout(() => {
            if (notification.parentElement) {
                notification.remove();
            }
        }, 5000);
    }
}

// API Service
class TradingAPIService {
    static async fetchQuote(symbol) {
        try {
            const response = await fetch(
                `${CONFIG.API_BASE_URL}/quote?symbol=${symbol}&apikey=${CONFIG.API_KEY}`
            );
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.status === 'error' || data.code) {
                throw new Error(data.message || 'API error');
            }
            
            return data;
        } catch (error) {
            console.error('API fetch error:', error);
            throw new Error(`Failed to fetch data for ${symbol}: ${error.message}`);
        }
    }

    static async fetchHistoricalData(symbol, startDate, endDate) {
        try {
            const response = await fetch(
                `${CONFIG.API_BASE_URL}/time_series?symbol=${symbol}&interval=1day&start_date=${startDate}&end_date=${endDate}&apikey=${CONFIG.API_KEY}`
            );
            
            if (!response.ok) {
                throw new Error(`HTTP ${response.status}`);
            }
            
            const data = await response.json();
            
            if (data.status === 'error' || !data.values) {
                throw new Error(data.message || 'No historical data available');
            }
            
            return data.values;
        } catch (error) {
            console.error('Historical data error:', error);
            throw new Error(`Failed to fetch historical data: ${error.message}`);
        }
    }
}

// Price Manager
class PriceManager {
    static async updateLivePrice(symbol) {
        const livePriceElem = document.getElementById('livePrice');
        const priceChangeElem = document.getElementById('priceChange');
        
        if (!livePriceElem || !priceChangeElem) return;
        
        livePriceElem.textContent = "$--";
        priceChangeElem.textContent = "Loading...";
        priceChangeElem.className = 'price-change loading';
        
        try {
            const data = await TradingAPIService.fetchQuote(symbol);
            
            if (data && data.close) {
                const price = parseFloat(data.close);
                const open = parseFloat(data.open);
                const change = price - open;
                const changePercent = ((change / open) * 100);
                
                livePriceElem.textContent = `$${price.toFixed(2)}`;
                priceChangeElem.textContent = 
                    `${change >= 0 ? '+' : ''}${change.toFixed(2)} (${changePercent.toFixed(2)}%)`;
                priceChangeElem.className = `price-change ${change >= 0 ? 'positive' : 'negative'}`;
                
                AppState.currentSymbol = symbol;
                NotificationManager.show(`${symbol} price updated`, 'success');
            } else {
                throw new Error('Invalid price data');
            }
        } catch (error) {
            livePriceElem.textContent = "$--";
            priceChangeElem.textContent = "Data unavailable";
            priceChangeElem.className = 'price-change error';
            NotificationManager.show(error.message, 'error');
        }
    }

    static startAutoRefresh(symbol, interval = 30000) {
        // Clear existing interval
        if (AppState.priceUpdateInterval) {
            clearInterval(AppState.priceUpdateInterval);
        }
        
        // Update immediately
        this.updateLivePrice(symbol);
        
        // Set up interval
        AppState.priceUpdateInterval = setInterval(() => {
            this.updateLivePrice(symbol);
        }, interval);
    }

    static stopAutoRefresh() {
        if (AppState.priceUpdateInterval) {
            clearInterval(AppState.priceUpdateInterval);
            AppState.priceUpdateInterval = null;
        }
    }
}

// Order Manager
class OrderManager {
    static addOrder(orderData) {
        const order = {
            id: Date.now().toString(),
            symbol: orderData.symbol,
            type: orderData.type,
            quantity: orderData.quantity,
            orderType: orderData.orderType,
            price: orderData.price || null,
            status: 'pending',
            timestamp: new Date().toISOString(),
            executedPrice: null
        };
        
        AppState.orders.unshift(order);
        
        // Keep only latest orders
        if (AppState.orders.length > CONFIG.MAX_ORDERS_DISPLAY) {
            AppState.orders = AppState.orders.slice(0, CONFIG.MAX_ORDERS_DISPLAY);
        }
        
        this.saveOrders();
        this.renderOrders();
        
        // Simulate order execution
        this.simulateOrderExecution(order.id);
        
        return order;
    }

    static cancelOrder(orderId) {
        const orderIndex = AppState.orders.findIndex(order => order.id === orderId);
        if (orderIndex !== -1 && AppState.orders[orderIndex].status === 'pending') {
            AppState.orders[orderIndex].status = 'cancelled';
            this.saveOrders();
            this.renderOrders();
            NotificationManager.show('Order cancelled', 'warning');
            return true;
        }
        return false;
    }

    static simulateOrderExecution(orderId) {
        setTimeout(() => {
            const orderIndex = AppState.orders.findIndex(o => o.id === orderId);
            if (orderIndex !== -1 && AppState.orders[orderIndex].status === 'pending') {
                AppState.orders[orderIndex].status = 'completed';
                AppState.orders[orderIndex].executedPrice = 
                    (Math.random() * 10 + AppState.orders[orderIndex].price) || 100;
                this.saveOrders();
                this.renderOrders();
                NotificationManager.show(`Order ${orderId} executed`, 'success');
            }
        }, 2000 + Math.random() * 3000);
    }

    static renderOrders() {
        const ordersList = document.getElementById('ordersList');
        if (!ordersList) return;
        
        if (AppState.orders.length === 0) {
            ordersList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-inbox"></i>
                    <h3>No Orders Yet</h3>
                    <p>Your trade orders will appear here</p>
                </div>
            `;
            return;
        }
        
        ordersList.innerHTML = AppState.orders.map(order => `
            <div class="order-item ${order.status}">
                <div class="order-header">
                    <div class="order-symbol">${order.symbol}</div>
                    <div class="order-type-badge ${order.type}">${order.type.toUpperCase()}</div>
                </div>
                <div class="order-details">
                    <div class="order-info">
                        <span class="info-label">Quantity:</span>
                        <span class="info-value">${order.quantity} shares</span>
                    </div>
                    <div class="order-info">
                        <span class="info-label">Type:</span>
                        <span class="info-value">${order.orderType}</span>
                    </div>
                    ${order.executedPrice ? `
                    <div class="order-info">
                        <span class="info-label">Executed at:</span>
                        <span class="info-value">$${order.executedPrice.toFixed(2)}</span>
                    </div>
                    ` : ''}
                </div>
                <div class="order-footer">
                    <div class="order-status ${order.status}">
                        <i class="${this.getStatusIcon(order.status)}"></i>
                        ${order.status}
                    </div>
                    <div class="order-actions">
                        ${order.status === 'pending' ? `
                        <button class="action-btn cancel" onclick="OrderManager.cancelOrder('${order.id}')">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                        ` : ''}
                        <span class="order-time">${this.formatTime(order.timestamp)}</span>
                    </div>
                </div>
            </div>
        `).join('');
    }

    static getStatusIcon(status) {
        const icons = {
            pending: 'fas fa-clock',
            completed: 'fas fa-check-circle',
            cancelled: 'fas fa-ban',
            rejected: 'fas fa-exclamation-circle'
        };
        return icons[status] || 'fas fa-question-circle';
    }

    static formatTime(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diffMs = now - date;
        const diffMins = Math.floor(diffMs / 60000);
        const diffHours = Math.floor(diffMs / 3600000);
        
        if (diffMins < 1) return 'Just now';
        if (diffMins < 60) return `${diffMins}m ago`;
        if (diffHours < 24) return `${diffHours}h ago`;
        return date.toLocaleDateString();
    }

    static saveOrders() {
        try {
            localStorage.setItem('tradingOrders', JSON.stringify(AppState.orders));
        } catch (error) {
            console.error('Failed to save orders:', error);
        }
    }

    static clearOrders() {
        AppState.orders = [];
        this.saveOrders();
        this.renderOrders();
        NotificationManager.show('All orders cleared', 'info');
    }
}

// Historical Data Manager
class HistoricalDataManager {
    static async loadHistoricalData(symbol, fromDate, toDate) {
        const historyList = document.getElementById('historyList');
        if (!historyList) return;
        
        historyList.innerHTML = `
            <div class="empty-state">
                <i class="fas fa-spinner fa-spin"></i>
                <p>Loading historical data for ${symbol}...</p>
            </div>
        `;
        
        try {
            const historicalData = await TradingAPIService.fetchHistoricalData(symbol, fromDate, toDate);
            this.renderHistoricalData(historicalData, symbol);
            NotificationManager.show(`Historical data loaded for ${symbol}`, 'success');
        } catch (error) {
            historyList.innerHTML = `
                <div class="empty-state error">
                    <i class="fas fa-exclamation-triangle"></i>
                    <h3>Data Unavailable</h3>
                    <p>${error.message}</p>
                </div>
            `;
            NotificationManager.show(error.message, 'error');
        }
    }

    static renderHistoricalData(data, symbol) {
        const historyList = document.getElementById('historyList');
        if (!historyList) return;
        
        if (!data || data.length === 0) {
            historyList.innerHTML = `
                <div class="empty-state">
                    <i class="fas fa-chart-line"></i>
                    <h3>No Data Available</h3>
                    <p>No historical data found for ${symbol}</p>
                </div>
            `;
            return;
        }
        
        historyList.innerHTML = data.slice(0, 10).map(day => {
            const open = parseFloat(day.open);
            const high = parseFloat(day.high);
            const low = parseFloat(day.low);
            const close = parseFloat(day.close);
            const volume = parseInt(day.volume);
            const change = close - open;
            const changePercent = ((change / open) * 100);
            
            return `
                <div class="history-item">
                    <div class="history-header">
                        <div class="history-date">${new Date(day.datetime).toLocaleDateString()}</div>
                        <div class="history-change ${change >= 0 ? 'positive' : 'negative'}">
                            ${change >= 0 ? '+' : ''}${changePercent.toFixed(2)}%
                        </div>
                    </div>
                    <div class="history-details">
                        <div class="history-detail">
                            <span class="detail-label">Open</span>
                            <span class="detail-value">$${open.toFixed(2)}</span>
                        </div>
                        <div class="history-detail">
                            <span class="detail-label">High</span>
                            <span class="detail-value">$${high.toFixed(2)}</span>
                        </div>
                        <div class="history-detail">
                            <span class="detail-label">Low</span>
                            <span class="detail-value">$${low.toFixed(2)}</span>
                        </div>
                        <div class="history-detail">
                            <span class="detail-label">Close</span>
                            <span class="detail-value">$${close.toFixed(2)}</span>
                        </div>
                        <div class="history-detail">
                            <span class="detail-label">Volume</span>
                            <span class="detail-value">${volume.toLocaleString()}</span>
                        </div>
                    </div>
                </div>
            `;
        }).join('');
    }

    static setDefaultDates() {
        const histFrom = document.getElementById('histFrom');
        const histTo = document.getElementById('histTo');
        
        if (histFrom && histTo) {
            const today = new Date();
            const thirtyDaysAgo = new Date();
            thirtyDaysAgo.setDate(today.getDate() - 30);
            
            histFrom.value = thirtyDaysAgo.toISOString().split('T')[0];
            histTo.value = today.toISOString().split('T')[0];
        }
    }
}

// Trade Form Manager
class TradeFormManager {
    constructor() {
        this.tradeForm = document.getElementById('tradeForm');
        this.tickerInput = document.getElementById('tickerInput');
        this.tradeTypeButtons = document.querySelectorAll('.trade-type-btn');
        this.debouncedPriceUpdate = this.debounce(this.handleTickerInput.bind(this), CONFIG.DEBOUNCE_DELAY);
        this.init();
    }

    init() {
        if (this.tradeForm) {
            this.tradeForm.addEventListener('submit', this.handleSubmit.bind(this));
        }
        
        if (this.tickerInput) {
            this.tickerInput.addEventListener('input', this.debouncedPriceUpdate);
        }
        
        this.setupTradeTypeButtons();
    }

    setupTradeTypeButtons() {
        this.tradeTypeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                this.tradeTypeButtons.forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                AppState.currentTradeType = btn.dataset.type;
            });
        });
    }

    async handleSubmit(event) {
        event.preventDefault();
        
        const symbol = this.tickerInput.value.trim().toUpperCase();
        const quantity = parseInt(document.getElementById('quantity').value);
        const orderType = document.getElementById('orderType').value;
        
        if (!symbol) {
            NotificationManager.show('Please enter a stock symbol', 'error');
            return;
        }
        
        if (!quantity || quantity <= 0) {
            NotificationManager.show('Please enter a valid quantity', 'error');
            return;
        }
        
        try {
            // Verify symbol exists by fetching current price
            const quote = await TradingAPIService.fetchQuote(symbol);
            const currentPrice = parseFloat(quote.close);
            
            const order = OrderManager.addOrder({
                symbol,
                type: AppState.currentTradeType,
                quantity,
                orderType,
                price: currentPrice
            });
            
            NotificationManager.show(
                `${AppState.currentTradeType.toUpperCase()} order placed for ${quantity} shares of ${symbol}`,
                'success'
            );
            
            // Update live price display
            PriceManager.updateLivePrice(symbol);
            
            // Reset form but keep symbol
            this.tradeForm.reset();
            this.tickerInput.value = symbol;
            this.tradeTypeButtons[0].click();
            
        } catch (error) {
            NotificationManager.show(`Invalid symbol: ${symbol}`, 'error');
        }
    }

    handleTickerInput(event) {
        const symbol = event.target.value.trim().toUpperCase();
        if (symbol) {
            PriceManager.updateLivePrice(symbol);
            
            // Update historical data symbol
            const histTicker = document.getElementById('histTicker');
            if (histTicker) {
                histTicker.value = symbol;
            }
        }
    }

    debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }
}

// Search Manager
class SearchManager {
    constructor() {
        this.searchHistoricalBtn = document.getElementById('searchHistoricalBtn');
        this.histTicker = document.getElementById('histTicker');
        this.init();
    }

    init() {
        if (this.searchHistoricalBtn) {
            this.searchHistoricalBtn.addEventListener('click', this.handleSearch.bind(this));
        }
    }

    handleSearch() {
        const symbol = this.histTicker.value.trim().toUpperCase();
        const fromDate = document.getElementById('histFrom').value;
        const toDate = document.getElementById('histTo').value;
        
        if (!symbol) {
            NotificationManager.show('Please enter a stock symbol', 'error');
            return;
        }
        
        HistoricalDataManager.loadHistoricalData(symbol, fromDate, toDate);
    }
}

// Main Trading Application
class TradingApp {
    constructor() {
        this.mobileMenu = null;
        this.tradeFormManager = null;
        this.searchManager = null;
        this.init();
    }

    async init() {
        console.log('🚀 Initializing Trading Application...');
        
        // Initialize components
        this.mobileMenu = new MobileMenu();
        this.tradeFormManager = new TradeFormManager();
        this.searchManager = new SearchManager();
        
        // Load initial data
        await this.loadInitialData();
        
        // Set up auto-refresh
        PriceManager.startAutoRefresh(CONFIG.DEFAULT_SYMBOL);
        
        console.log('✅ Trading Application initialized successfully');
    }

    async loadInitialData() {
        // Load initial price
        await PriceManager.updateLivePrice(CONFIG.DEFAULT_SYMBOL);
        
        // Set default historical dates
        HistoricalDataManager.setDefaultDates();
        
        // Load initial historical data
        HistoricalDataManager.loadHistoricalData(CONFIG.DEFAULT_SYMBOL);
        
        // Render existing orders
        OrderManager.renderOrders();
    }

    destroy() {
        PriceManager.stopAutoRefresh();
        console.log('📋 Trading Application destroyed');
    }
}

// Global functions for HTML event handlers
function cancelOrder(orderId) {
    OrderManager.cancelOrder(orderId);
}

function clearAllOrders() {
    if (confirm('Are you sure you want to clear all orders?')) {
        OrderManager.clearOrders();
    }
}

function refreshPrice() {
    const tickerInput = document.getElementById('tickerInput');
    const symbol = tickerInput?.value.trim().toUpperCase() || CONFIG.DEFAULT_SYMBOL;
    PriceManager.updateLivePrice(symbol);
}

// Initialize the application
document.addEventListener('DOMContentLoaded', async () => {
    window.tradingApp = new TradingApp();
});

// Error boundary
window.addEventListener('error', (event) => {
    console.error('Global error:', event.error);
    NotificationManager.show('An unexpected error occurred', 'error');
});
